name: Build Android AAB + APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: artifacts/mobile

    steps:
      - name: Free disk space
        working-directory: /home/runner
        run: |
          echo "Before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/julia* /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "After cleanup:"; df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('artifacts/mobile/android/**/*.gradle*', 'artifacts/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install EAS CLI
        working-directory: .
        run: npm install -g eas-cli@latest

      - name: Bump version in app.json
        id: version
        run: |
          NEW_VERSION=$(node -e "
            const fs = require('fs');
            const path = './app.json';
            const app = JSON.parse(fs.readFileSync(path, 'utf8'));
            app.expo.android.versionCode += 1;
            fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
            console.log(app.expo.android.versionCode);
          ")
          echo "code=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $NEW_VERSION"

      - name: Commit bumped version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "chore: bump versionCode to ${{ steps.version.outputs.code }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Build AAB (production profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
        run: eas build --platform android --profile production --local --non-interactive --output ../../adhkar-app-${{ steps.version.outputs.tag }}.aab

      - name: Build APK (preview profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
        run: eas build --platform android --profile preview --local --non-interactive --output ../../adhkar-app-${{ steps.version.outputs.tag }}.apk

      - name: Get SHA-256 fingerprint
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs ../../adhkar-app-${{ steps.version.outputs.tag }}.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -x
          TAG=${{ steps.version.outputs.tag }}
          if gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "أذكار الصباح والمساء $TAG" \
            --notes "## الإصدار $TAG

          **APK (تثبيت مباشر):**
          https://github.com/${{ github.repository }}/releases/download/$TAG/adhkar-app-$TAG.apk

          **AAB (Google Play):**
          https://github.com/${{ github.repository }}/releases/download/$TAG/adhkar-app-$TAG.aab" \
            adhkar-app-$TAG.aab \
            adhkar-app-$TAG.apk; then
            echo "Release created successfully."
          else
            echo "gh release create failed (see error above) — checking if release already exists so we can fall back to upload..."
            if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
              echo "Release already exists, uploading assets instead."
              gh release upload "$TAG" \
                adhkar-app-$TAG.aab \
                adhkar-app-$TAG.apk \
                --repo ${{ github.repository }} --clobber
            else
              echo "::error::Release does not exist and could not be created. This is usually a repo permissions issue — check Settings > Actions > General > Workflow permissions is set to 'Read and write permissions'."
              exit 1
            fi
          fi

      - name: Upload AAB to Google Play Internal Testing
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_KEY_JSON }}
          packageName: com.adhkar.morningevening
          releaseFiles: adhkar-app-${{ steps.version.outputs.tag }}.aab
          track: internal
          status: completed

      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          JOB_STATUS: ${{ job.status }}
        working-directory: .
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured, skipping notification"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"
            STATUS_AR="نجح البناء"
          else
            ICON="❌"
            STATUS_AR="فشل البناء"
          fi
          MESSAGE="${ICON} <b>أذكار الصباح والمساء — ${STATUS_AR}</b>%0A%0A📦 الإصدار: <code>${VERSION_TAG}</code>%0A⚙️ <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">تفاصيل التشغيل</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
